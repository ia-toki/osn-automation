---
- name: checkall
  hosts: contestants
  environment:
    http_proxy: "http://192.168.14.70:3142"
    https_proxy: "http://192.168.14.70:3142"
  tasks:
    - name: Install compiler
      become: true
      become_user: root
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      with_items:
        - build-essential
        - libreoffice