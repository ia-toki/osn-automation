---
- name: Cleanup firewall
  hosts: contestants
  become: true
  become_user: root
  tasks:
    - name: Reset firewall # TODO: restore original rules instead
      tags:
        - config
        - firewall
      community.general.ufw:
        state: reset

- name: Archive contestant workstation
  hosts: contestants
  tasks:
    # TODO: not idempotent, and refactor as roles/takeout
    - name: Fetch bash_history
      become: true
      become_user: "{{ contestant_username }}"
      tags: takeout
      ansible.builtin.fetch:
        src: "{{ ansible_facts['env']['HOME'] }}/.bash_history"
        dest: "{{ playbook_dir }}/takeout/{{ ansible_host }}.bash_history"
        flat: true
        fail_on_missing: false

- name: Cleanup contestant user
  hosts: contestants
  roles:
    - name: Remove user for contestant
      role: usermgmt
      vars:
        usermgmt_action: delete
        usermgmt_username: "{{ contestant_username }}"
