---
- name: Cleanup firewall
  hosts: contestants
  become: true
  become_user: root
  tasks:
    - name: Reset UFW to clear all rules
      community.general.ufw:
        state: reset

    - name: Enable UFW to apply the changes
      become: true
      community.general.ufw:
        state: disabled

