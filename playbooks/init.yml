---
- name: Install basic packages
  hosts: all
  tasks:
    - name: Install mandatory packages
      become: true
      become_user: root
      tags: package
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      with_items:
        - openssh-server
        - sudo
        - unzip
        - acl
        - ufw

        # ansible-related
        - python3
        - python3-apt
        - apt-utils

- name: SSH Hardening
  hosts: all
  tasks:
    - name: Authorized control pubkey
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', superadmin_pubkey_path | mandatory) }}"

    - name: Disable password-based authentication
      become: true
      become_user: root
      notify: Restart ssh-server
      ansible.builtin.lineinfile:
        path: "/etc/ssh/sshd_config"
        regexp: '^\s*{{ item.key }}\b'
        line: "{{ item.key }} {{ item.value }}"
      with_items:
        - key: "PermitRootLogin"
          value: "prohibit-password"
        - key: "PubkeyAuthentication"
          value: "yes"
        - key: "PasswordAuthentication"
          value: "no"

  handlers:
    - name: Restart ssh-server
      become: true
      become_user: root
      tags: always
      ansible.builtin.service:
        name: ssh
        state: restarted
