---
- name: Check user existence
  ansible.builtin.user:
    name: "{{ usermgmt_username }}"
  check_mode: true
  changed_when: false
  register: usermgmt_delete_existence

- name: Force kill process by user
  when: usermgmt_delete_existence.state | default('') == 'present'
  become: true
  ansible.builtin.command:
    cmd: "pkill -9 -u {{ usermgmt_username }}"
  register: usermgmt_delete_pkill
  changed_when: usermgmt_delete_pkill.rc == 1
  failed_when: usermgmt_delete_pkill.rc > 1
  # rc: 0 any match, 1 no match, 2 invalid options, 3 internal error

- name: Remove user
  become: true
  notify: Restart gdm
  ansible.builtin.user:
    name: "{{ usermgmt_username }}"
    state: absent
    remove: true
