---
argument_specs:
  main:
    options:
      cppreference_version:
        type: str
        default: "20250209"

      cppreference_target_dir:
        type: str
        default: "/opt/cppreference{{ cppreference_version }}"

      cppreference_source:
        type: str
        default: "https://github.com/PeterFeicht/cppreference-doc/releases/download/v{{ cppreference_version }}/html-book-{{ cppreference_version }}.zip"

      cppreference_local_file:
        type: str
        default: "{{ playbook_dir }}/downloaded/cppreference{{ cppreference_version }}.zip"
