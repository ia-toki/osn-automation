---
- name: "Download cppreference {{ cppreference_version }}"
  become: false
  delegate_to: localhost
  run_once: true
  ansible.builtin.get_url:
    url: "{{ cppreference_source }}"
    dest: "{{ role_path }}/files/cppreference-{{ cppreference_version }}.zip"
    mode: "0644"

- name: Create cppreference directory
  tags: asset
  ansible.builtin.file:
    path: "{{ cppreference_target_dir }}"
    state: directory
    mode: "0755"

- name: Extract cppreference archive
  tags: asset
  ansible.builtin.unarchive:
    src: "cppreference-{{ cppreference_version }}.zip"
    dest: "{{ cppreference_target_dir }}"
    remote_src: false
    creates: "{{ cppreference_target_dir }}/cppreference-doxygen-local.tag.xml"
