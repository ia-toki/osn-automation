---
argument_specs:
  main:
    options:
      app_vscode_install:
        type: bool
        default: false
      app_vscode_version:
        type: str
        default: "1.137.0"
      app_vscode_source:
        type: str
        default: "https://update.code.visualstudio.com/{{ app_vscode_version }}/linux-deb-x64/stable"
      app_vscode_local_file:
        type: str
        default: "{{ playbook_dir }}/downloaded/vscode-{{ app_vscode_version }}.deb"

      app_vscode_settings_file:
        type: str
        default: "settings.json"
