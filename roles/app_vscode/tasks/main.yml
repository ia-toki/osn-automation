---
- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install vscode
  when: "app_vscode_force_install or 'code' not in ansible_facts.packages"
  ansible.builtin.include_tasks:
    file: install.yml

- name: Distribute default settings
  block:
    - name: Create parent directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/Code/User/"
        state: directory
        mode: "0755"

    - name: Distribute default settings
      ansible.builtin.copy:
        src: "{{ app_vscode_settings_file }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/Code/User/settings.json"
        mode: "0644"
